# Schema for data/profile.yaml (generated by /setup-profile). Used to fill application forms.
resume:
  dir: "data/resumes"                    # all resumes live here
  default: "Jansen_Yan_Resume.pdf"       # used for every application for now
  # Future: pick a resume per job title, e.g.
  # by_title:
  #   - {match: "frontend", file: "Jansen_Yan_Resume_Frontend.pdf"}
contact:
  first_name: ""
  last_name: ""
  preferred_name: ""
  email: ""
  phone: ""
  city: ""
  state: ""
  country: "United States"
  zip: ""
links:
  linkedin: ""
  github: ""
  portfolio: ""
work_authorization:
  authorized_us: true            # legally authorized to work in the US
  requires_sponsorship: false    # now or in the future
preferences:
  desired_salary: 0              # annual USD; used when a number is required
  salary_answer: ""              # text answer, e.g. "Open / negotiable, targeting $X"
  willing_to_relocate: false
  remote_preference: "remote or hybrid"
  start_date: "2 weeks notice"
experience:
  years_total: 0
  current_title: ""
  current_company: ""
  recent_roles:                  # most recent first
    - {title: "", company: "", start: "", end: "", summary: ""}
  skills: {}                     # skill -> years, e.g. {python: 5, react: 3}
education:
  - {degree: "", field: "", school: "", graduation_year: ""}
eeo:                             # voluntary self-identification
  gender: "Decline to self-identify"
  race_ethnicity: "Decline to self-identify"
  veteran_status: "I don't wish to answer"
  disability_status: "I don't wish to answer"
canned_answers:                  # reused for common free-text questions
  why_interested: ""
  how_did_you_hear: "Job board"
  cover_letter: ""               # leave empty to skip optional cover letters
