# Schema for data/criteria.yaml (generated by /setup-profile). Controls search + matching.
titles:
  - "Software Engineer"
  - "Senior Software Engineer"
  - "Backend Engineer"
  - "Full Stack Engineer"
seniority: ["mid", "senior"]       # exclude e.g. intern, staff, principal, manager
locations:
  - "Remote, United States"
remote: "remote_or_hybrid"         # remote_only | remote_or_hybrid | any
posted_within_days: 7
min_salary: 0                      # skip postings whose listed max is below this (0 = ignore)
excluded_companies: []
excluded_keywords: ["clearance required", "TS/SCI"]
match_threshold: 70                # >= apply; threshold-10..threshold-1 => needs_review; below => skip
daily_cap: 25
boards: ["linkedin", "builtin", "glassdoor", "jobright"]

# Google Sheet every application is logged to (filled in through Claude in Chrome).
sheet:
  url: "https://docs.google.com/spreadsheets/d/1FDKrQ5KOiu2-LW0mrJ0YvXbyLXgW95qcGMZfvCS0HBI/edit?gid=0#gid=0"
  tab: "Sheet1"
  # Legend cells whose fill colour is copied (paste format only) onto new rows.
  format_cells:
    remote: "H1"        # green
    hybrid: "H2"        # orange
    onsite: "H3"        # blue ("In Person")
    contract: "H4"      # purple, overrides remote/hybrid/onsite
    no_response: "I5"   # magenta "No Response" for column E
